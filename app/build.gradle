plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vivo.cnm.lico'
    compileSdk 37

    defaultConfig {
        applicationId "com.vivo.cnm.lico"
        minSdk 28
        targetSdk 37
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.savedstate:savedstate-ktx:1.4.0'
    implementation 'androidx.savedstate:savedstate-compose:1.4.0'

    implementation 'androidx.compose.ui:ui:1.12.1'
    implementation 'androidx.compose.ui:ui-graphics:1.12.1'
    implementation 'androidx.compose.ui:ui-text:1.12.1'
    implementation 'androidx.compose.ui:ui-unit:1.12.1'
    implementation 'androidx.compose.ui:ui-geometry:1.12.1'
    implementation 'androidx.compose.ui:ui-util:1.12.1'
    implementation 'androidx.compose.foundation:foundation:1.12.1'
    implementation 'androidx.compose.foundation:foundation-layout:1.12.1'
    implementation 'androidx.compose.animation:animation:1.12.1'
    implementation 'androidx.compose.animation:animation-core:1.12.1'
    implementation 'androidx.compose.runtime:runtime:1.12.1'
    implementation 'androidx.compose.runtime:runtime-saveable:1.12.1'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.compose.material:material-ripple:1.12.1'

    implementation 'androidx.emoji2:emoji2:1.4.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'androidx.window:window:1.5.0'
    implementation 'androidx.graphics:graphics-path:1.0.1'
    implementation 'androidx.tracing:tracing:1.2.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
